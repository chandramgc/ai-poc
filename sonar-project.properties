# ============================================================
# SonarQube Self-Hosted Configuration
# ============================================================
# Docs: https://docs.sonarsource.com/sonarqube/latest/

# ------------------------------------------------------------
# Project Identity
# ------------------------------------------------------------
sonar.projectKey=ai-poc
sonar.projectName=AI POC (Spring Boot)
sonar.projectVersion=1.0.0

# ------------------------------------------------------------
# SonarQube Server (self-hosted)
# Override via environment: SONAR_HOST_URL, SONAR_TOKEN
# ------------------------------------------------------------
sonar.host.url=http://localhost:9000

# Token — set via environment variable, never hardcode (S2068)
# export SONAR_TOKEN=<your-token>

# ------------------------------------------------------------
# Source & Test Directories
# ------------------------------------------------------------
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# ------------------------------------------------------------
# Java Version
# ------------------------------------------------------------
sonar.java.source=25
sonar.java.target=25

# ------------------------------------------------------------
# Coverage (JaCoCo)
# ------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.java.coveragePlugin=jacoco

# ------------------------------------------------------------
# Quality Gate
# Coverage on new code >= 80%
# New blockers = 0, New criticals = 0
# Duplications <= 3%
# ------------------------------------------------------------
# Quality gate is configured on the SonarQube server UI.
# Default: "Sonar way" (recommended baseline)

# ------------------------------------------------------------
# Exclusions
# ------------------------------------------------------------
# Source exclusions — do not analyze generated/boilerplate code
sonar.exclusions=\
  **/generated/**,\
  **/model/**/*Generated*.java,\
  **/*Application.java,\
  **/dto/**,\
  **/entity/**

# Test exclusions — do not count test code in main metrics
sonar.test.exclusions=\
  **/test/**

# Coverage exclusions — skip coverage on Spring Boot config, DTOs, entity, and exception classes
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/entity/**,\
  **/domain/**/*Entity.java,\
  **/*Application.java,\
  **/*Exception.java,\
  **/exception/GlobalExceptionHandler.java

# Duplication exclusions
sonar.cpd.exclusions=\
  **/dto/**,\
  **/entity/**

# ------------------------------------------------------------
# Issue Severity Overrides (examples)
# Change rule severity if your team agrees on a different level
# ------------------------------------------------------------
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1135
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/legacy/**
